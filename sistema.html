<!doctype html><html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Sistema Tajy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: barra lateral ciruela fija con la marca + área de trabajo amplia; papel en claro, vidrio en oscuro (lenguaje de Pulso con la marca Tajy) */
:root{
  --c1:#2E0F2B;--c2:#E67BA8;
  --bg:#F5F0F3;--surface:#FFFFFF;--surface-2:#FAF6F8;--solid:#FFFFFF;--line:rgba(46,15,43,.10);--line-2:rgba(46,15,43,.18);
  --tx:#22111E;--mut:#6B5766;--ink:#A63A6E;--on-accent:#2E0F2B;
  --ok:#1E8556;--ok-bg:rgba(30,133,86,.10);--warn:#B86E00;--warn-bg:rgba(245,166,35,.15);--bad:#C0354A;--bad-bg:rgba(192,53,74,.10);
  --info:#2B66D1;--info-bg:rgba(43,102,209,.10);--occ:#7444A8;--occ-bg:rgba(116,68,168,.10);
  --shadow:0 1px 2px rgba(46,15,43,.05),0 12px 32px -14px rgba(46,15,43,.16);--blur:none;--glow:rgba(230,123,168,.14);
  --side-tx:#F6E9F0;--side-mut:rgba(246,233,240,.66);
  --f:'Geist',ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif;--fm:'Geist Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#130A12;--surface:rgba(255,255,255,.045);--surface-2:rgba(255,255,255,.07);--solid:#1F1019;--line:rgba(255,255,255,.09);--line-2:rgba(255,255,255,.17);
  --tx:#F5EDF2;--mut:#B9A5B2;--ink:#F29BC1;
  --ok:#5ED39B;--ok-bg:rgba(94,211,155,.13);--warn:#F5B454;--warn-bg:rgba(245,180,84,.15);--bad:#FF7D8F;--bad-bg:rgba(255,125,143,.13);
  --info:#86AEFF;--info-bg:rgba(134,174,255,.13);--occ:#C3A5F5;--occ-bg:rgba(195,165,245,.14);
  --shadow:0 24px 48px -28px rgba(0,0,0,.7);--blur:blur(14px) saturate(140%);--glow:rgba(230,123,168,.16);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#130A12;--surface:rgba(255,255,255,.045);--surface-2:rgba(255,255,255,.07);--solid:#1F1019;--line:rgba(255,255,255,.09);--line-2:rgba(255,255,255,.17);
  --tx:#F5EDF2;--mut:#B9A5B2;--ink:#F29BC1;
  --ok:#5ED39B;--ok-bg:rgba(94,211,155,.13);--warn:#F5B454;--warn-bg:rgba(245,180,84,.15);--bad:#FF7D8F;--bad-bg:rgba(255,125,143,.13);
  --info:#86AEFF;--info-bg:rgba(134,174,255,.13);--occ:#C3A5F5;--occ-bg:rgba(195,165,245,.14);
  --shadow:0 24px 48px -28px rgba(0,0,0,.7);--blur:blur(14px) saturate(140%);--glow:rgba(230,123,168,.16);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 var(--f);color:var(--tx);background:radial-gradient(1100px 520px at 92% -10%,var(--glow),transparent 62%) fixed,var(--bg);-webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--c1);color:var(--side-tx);display:flex;flex-direction:column;gap:22px;padding-block:22px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px}
.brand{display:flex;gap:12px;align-items:center;padding:0 6px}
.brand img{width:52px;height:52px;border-radius:14px;object-fit:cover;box-shadow:0 0 0 1px rgba(255,255,255,.14)}
.brand b{display:block;font-size:15px;font-weight:600;letter-spacing:-.01em;line-height:1.25}
.brand small{color:var(--side-mut);font-size:12.5px}
nav{display:flex;flex-direction:column;gap:2px}
nav button{display:flex;align-items:center;gap:11px;border:0;background:transparent;color:var(--side-mut);font:inherit;font-size:14.5px;font-weight:500;padding:10px 12px;border-radius:12px;cursor:pointer;text-align:left;white-space:nowrap;transition:background .15s,color .15s}
nav button svg{flex:none}
nav button:hover{background:rgba(255,255,255,.07);color:var(--side-tx)}
nav button.on{background:rgba(230,123,168,.17);color:#fff;box-shadow:inset 0 0 0 1px rgba(230,123,168,.3)}
nav button.on svg{color:var(--c2)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;align-items:stretch;gap:8px;padding:0 6px}
.side .demo-tag{align-self:flex-start;background:var(--c2);color:var(--c1)}
.content{min-width:0;padding-left:clamp(16px,3.2vw,44px);padding-right:max(clamp(16px,3.2vw,44px),env(safe-area-inset-right,0px))}
main{max-width:1240px;margin:0 auto;padding-block:30px 72px}
@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;gap:14px;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  nav{flex-direction:row;overflow-x:auto;gap:6px;scrollbar-width:none;margin-inline:-2px}
  nav button{padding:9px 14px;border-radius:99px;background:rgba(255,255,255,.06)}
  .side-foot{flex-direction:row;flex-wrap:wrap;align-items:center;margin-top:0;padding:0}
  .content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  main{padding-block:22px 56px}
}
.eyebrow{font:500 12px var(--fm);text-transform:uppercase;letter-spacing:.1em;color:var(--ink);margin:0 0 8px}
h2{font-size:clamp(25px,2.4vw,32px);font-weight:650;letter-spacing:-.028em;line-height:1.12;margin:0 0 8px;text-wrap:balance;color:var(--tx)}
h3{font-size:15px;font-weight:600;letter-spacing:-.01em;margin:0 0 14px;color:var(--tx)}
.hint{color:var(--mut);margin:0 0 24px;max-width:70ch}
.sp{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:16px;box-shadow:var(--shadow);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);min-width:0}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));margin-bottom:16px}
.two{display:grid;gap:16px;grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:16px}
@media(max-width:860px){.two{grid-template-columns:1fr}}
.grid .card,.two .card{margin-bottom:0}
.kpi{display:flex;flex-direction:column;gap:6px}
.kpi .l{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
.kpi b{white-space:nowrap;font:600 clamp(24px,2.1vw,30px)/1.1 var(--f);letter-spacing:-.035em;color:var(--tx);font-variant-numeric:tabular-nums}
.kpi small{color:var(--mut);line-height:1.45}
.kpi-occ{flex-direction:row;align-items:center;gap:18px}
.kpi-occ>div:last-child{display:flex;flex-direction:column;gap:6px;min-width:0}
.ring{width:88px;height:88px;flex:none;border-radius:50%;background:conic-gradient(var(--c2) calc(var(--p)*1%),var(--line-2) 0);display:grid;place-items:center}
.ring span{width:70px;height:70px;border-radius:50%;background:var(--solid);display:grid;place-items:center;font:600 20px var(--f);letter-spacing:-.03em;font-variant-numeric:tabular-nums;color:var(--tx)}
.bars div{display:flex;align-items:center;gap:12px;margin:12px 0}
.bars span:first-child{width:84px;flex:none;font-size:13.5px;color:var(--mut)}
.bars i{height:10px;border-radius:99px;display:block}
.bars em{font:500 12.5px var(--fm);color:var(--tx);font-style:normal;white-space:nowrap}
.chart{display:flex;align-items:flex-end;gap:8px;height:180px;padding-top:6px}
.chart div{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:100%;font:500 11px var(--fm);color:var(--mut)}
.chart i{width:100%;max-width:38px;min-height:3px;display:block;border-radius:9px 9px 3px 3px;background:linear-gradient(180deg,var(--c2),color-mix(in srgb,var(--c2) 35%,transparent))}
.alerts{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.alerts li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;cursor:pointer;font-weight:500;color:var(--tx);background:var(--sb);transition:transform .15s}
.alerts li::before{content:"";width:8px;height:8px;border-radius:50%;flex:none;background:var(--sc);box-shadow:0 0 0 4px color-mix(in srgb,var(--sc) 22%,transparent)}
.alerts li:hover{transform:translateX(3px)}
.alerts .warn{--sc:var(--warn);--sb:var(--warn-bg)}.alerts .bad{--sc:var(--bad);--sb:var(--bad-bg)}.alerts .info{--sc:var(--info);--sb:var(--info-bg)}.alerts .ok{--sc:var(--ok);--sb:var(--ok-bg)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--mut);margin-bottom:16px}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--sc)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:99px;padding:11px 18px;font:inherit;font-weight:600;font-size:14.5px;cursor:pointer;background:var(--c2);color:var(--on-accent);text-decoration:none;transition:transform .12s,filter .15s;box-shadow:0 8px 20px -10px var(--c2)}
.btn:hover{filter:brightness(1.05);transform:translateY(-1px)}
.btn:active{transform:none}
.btn.sec{background:var(--surface-2);color:var(--tx);box-shadow:inset 0 0 0 1px var(--line-2)}
.btn.ghost{background:rgba(255,255,255,.07);color:var(--side-tx);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)}
.btn.sm{padding:7px 14px;font-size:13.5px}
.btn:disabled{opacity:.4;cursor:default;transform:none}
:focus-visible{outline:2px solid var(--c2);outline-offset:2px}
.calwrap{overflow-x:auto}
table.cal{border-collapse:separate;border-spacing:0;width:100%;min-width:920px;font-size:13px;table-layout:fixed}
.cal tr:first-child th:first-child{width:138px}
.cal th,.cal td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);height:46px;padding:0}
.cal tr:first-child th{font:500 10.5px var(--fm);text-transform:uppercase;letter-spacing:.06em;color:var(--mut);padding:8px 4px;text-align:center}
.cal tr:first-child th b{display:block;font:600 14px var(--f);color:var(--tx);letter-spacing:0;text-transform:none}
.cal th.today{background:color-mix(in srgb,var(--c2) 16%,transparent);border-radius:10px 10px 0 0}
.cal tr th:first-child{text-align:left;padding:6px 12px;white-space:nowrap;background:var(--solid);position:sticky;left:0;z-index:1;font:600 14px var(--fm)}
.cal tr th:first-child small{display:block;color:var(--mut);font:400 11px var(--f)}
.cal td.free{cursor:pointer}
.cal td.free:hover{background:color-mix(in srgb,var(--c2) 12%,transparent)}
.bar{width:calc(100% - 6px);margin:3px;height:38px;border:0;border-radius:10px;color:#fff;font:inherit;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 10px;text-align:left;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.lst{list-style:none;padding:0;margin:0}
.lst li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.lst li:last-child{border:0}
.lst small{color:var(--mut)}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px}
.room{border-radius:16px;padding:14px;font-size:12.5px;line-height:1.4;color:var(--tx);background:var(--sb);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--sc) 30%,transparent);display:flex;flex-direction:column;gap:2px}
.room b{font:600 22px var(--fm);letter-spacing:-.03em;display:flex;align-items:center;justify-content:space-between;margin-bottom:2px}
.room b::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--sc);box-shadow:0 0 0 4px color-mix(in srgb,var(--sc) 22%,transparent)}
button.room{border:0;font:inherit;text-align:left;cursor:pointer;min-height:100px;transition:transform .15s}
button.room:hover{transform:translateY(-2px)}
.st-occ{--sc:var(--occ);--sb:var(--occ-bg)}.st-free{--sc:var(--ok);--sb:var(--ok-bg)}.st-dirty{--sc:var(--warn);--sb:var(--warn-bg)}.st-mant{--sc:var(--bad);--sb:var(--bad-bg)}.st-arr{--sc:var(--info);--sb:var(--info-bg)}
.floor{margin:20px 0 10px;font:600 11px var(--fm);color:var(--mut);text-transform:uppercase;letter-spacing:.12em;display:flex;align-items:center;gap:12px}
.floor::after{content:"";flex:1;height:1px;background:var(--line)}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;padding:10px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);border-bottom:1px solid var(--line-2)}
.tbl td{padding:12px 10px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.tbl tr:last-child td{border-bottom:0}
.form{display:grid;gap:12px}
.form label{display:grid;gap:6px;font-size:13px;font-weight:600;color:var(--mut)}
.form input,.form select,.form textarea,.tbl input,textarea,#gq,.den input{padding:10px 12px;font:inherit;font-size:14.5px;font-weight:400;color:var(--tx);background:var(--solid);border:1px solid var(--line-2);border-radius:12px;width:100%;transition:border-color .15s,box-shadow .15s}
.form input:focus,.form select:focus,textarea:focus,.tbl input:focus,#gq:focus,.den input:focus{outline:0;border-color:var(--c2);box-shadow:0 0 0 3px color-mix(in srgb,var(--c2) 26%,transparent)}
.form input[type=color]{height:46px;padding:4px}
.form-2{grid-template-columns:1fr 1fr}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
dialog{border:1px solid var(--line);border-radius:22px;padding:26px;max-width:560px;width:calc(100% - 32px);background:var(--solid);color:var(--tx);box-shadow:0 40px 90px -30px rgba(0,0,0,.55)}
dialog::backdrop{background:rgba(20,6,18,.5);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
dialog h3{font-size:19px;letter-spacing:-.02em}
.inv{--tx:#1D1A1C;--mut:#6B6168;--line:#E7E0E5;--line-2:#D8CFD5;background:#fff;color:#1D1A1C;border:1px solid #E7E0E5;border-radius:14px;padding:18px;font-size:14px}
.invh{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #E7E0E5;padding-bottom:12px;align-items:flex-start}
.invt{border:2px solid #1D1A1C;font-size:28px;font-weight:800;width:56px;text-align:center;line-height:1.1;padding:4px;border-radius:6px}
.invt small{display:block;font-size:10px;font-weight:400}
.demo{color:#C0354A;font-weight:700;font-size:13px;text-align:center}
.browser{border:1px solid var(--line-2);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.bbar{background:var(--surface-2);padding:10px 16px;font:500 12.5px var(--fm);color:var(--mut);display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--line)}
.bbar::before{content:"";width:44px;height:10px;flex:none;background:radial-gradient(circle,var(--line-2) 4px,transparent 4.5px) 0 0/15px 10px repeat-x}
.site{--surface:#fff;--surface-2:#FAF6F9;--solid:#fff;--tx:#2A1F29;--mut:#6B5766;--line:#EEE5EB;--line-2:#DCCFD8;--shadow:0 1px 2px rgba(0,0,0,.04);--blur:none;background:#fff;color:#2A1F29;color-scheme:light}
.site section{padding:28px}
.hero{display:flex;gap:24px;align-items:center;color:#fff;flex-wrap:wrap}
.hero img{width:140px;height:140px;border-radius:20px;object-fit:cover}
.hero h1{margin:0 0 8px;font-size:34px;letter-spacing:-.03em;line-height:1.1}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line-2);background:var(--surface-2);color:var(--tx);border-radius:99px;padding:8px 14px;font:inherit;font-size:13.5px;cursor:pointer;transition:border-color .15s}
.chip:hover{border-color:var(--c2)}
.chat{display:flex;flex-direction:column;gap:10px;margin:16px 0;max-height:480px;overflow-y:auto}
.msg{max-width:80%;padding:12px 16px;border-radius:18px;white-space:pre-line;line-height:1.5}
.msg.me{align-self:flex-end;background:var(--c1);color:#fff;border-bottom-right-radius:6px}
.msg.ai{align-self:flex-start;background:var(--surface-2);border:1px solid var(--line);border-bottom-left-radius:6px}
#aiCard form input{background:var(--solid);color:var(--tx);border-radius:99px!important;padding:10px 16px!important}
#toast{position:fixed;left:50%;top:calc(18px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--c1);color:#fff;padding:12px 18px;border-radius:14px;border:1px solid rgba(255,255,255,.12);box-shadow:0 18px 40px -14px rgba(0,0,0,.45);z-index:50;max-width:min(560px,90vw);font-weight:500}
#tour{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--solid);color:var(--tx);border:1px solid var(--line-2);border-radius:20px;padding:20px;width:min(500px,calc(100% - 32px));box-shadow:0 30px 70px -20px rgba(0,0,0,.45);z-index:40}
#tour p{margin:0 0 14px;font-size:16.5px;line-height:1.5}
#tour small{color:var(--mut);font-family:var(--fm)}
.hl{outline:3px solid var(--c2);outline-offset:4px;border-radius:var(--r)}
.demo-tag{display:inline-block;background:color-mix(in srgb,var(--c2) 18%,transparent);color:var(--ink);border-radius:99px;padding:3px 10px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;vertical-align:middle}
.cash{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin-bottom:16px}
.cash .card{margin-bottom:0}
.den{display:grid;grid-template-columns:1fr 92px 1fr;gap:8px;align-items:center;font:500 13.5px var(--fm);margin:5px 0}
.den input{text-align:right;padding:8px 10px;font-family:var(--fm)}
.den em{font-style:normal;text-align:right;color:var(--mut)}
.tot{display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:10px;padding-top:10px;font-weight:600;font-variant-numeric:tabular-nums}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.seg{display:inline-flex;padding:3px;border:1px solid var(--line-2);border-radius:99px;background:var(--surface-2);gap:2px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:99px;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--mut)}
.seg button.on{background:var(--c2);color:var(--on-accent)}
.big .btn{min-height:52px;font-size:16px;padding:12px 18px}
.chk{display:flex!important;gap:12px;align-items:flex-start;font-weight:500!important;color:var(--tx)!important;font-size:14.5px!important}
.form .chk input{width:22px;height:22px;margin:0;padding:0;flex:none;accent-color:var(--c2)}
@media(max-width:600px){.big .btn{width:100%}.lst li{flex-wrap:wrap}.form-2{grid-template-columns:1fr}.kpi-occ{flex-direction:column;align-items:flex-start}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
.who{display:grid;gap:8px;padding:0 6px}
.who>span{font:500 10.5px var(--fm);text-transform:uppercase;letter-spacing:.12em;color:var(--side-mut)}
.who div{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:14px;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.who button{border:0;background:transparent;color:var(--side-mut);font:inherit;font-size:13px;font-weight:600;padding:8px 6px;border-radius:10px;cursor:pointer}
.who button:hover{color:var(--side-tx)}
.who button.on{background:var(--c2);color:var(--c1)}
[data-perfil="limpieza"] nav{display:none}
@media(max-width:900px){.who{padding:0}.who div{grid-template-columns:repeat(4,1fr)}}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;border-radius:99px;font-size:12px;font-weight:600;line-height:1.5;white-space:nowrap;vertical-align:middle;background:var(--sb);color:var(--tx)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--sc);flex:none}

function buildRooms(S) {
  const old = Object.fromEntries((S.rooms || []).map(r => [r.n, r]));
  S.rooms = []; let n = 101;
  for (const t of S.cfg.types) for (let i = 0; i < t.count; i++) {
    if (n % 100 > 8) n = (Math.floor(n / 100) + 1) * 100 + 1;
    S.rooms.push({n, type: t.id, dirty: old[n]?.dirty || false}); n++;
  }
}
function add(S, o) {
  const t = typeOf(roomType(o.room, S), S), e = S.empresas.find(e => e.id === o.emp);
  o.id = S.nid++;

}

// Mucamas de ejemplo (solo iniciales) y lo que se revisa en cada habitación.
const MUC = ['R. A.', 'M. L.', 'S. P.'];
const CHK = ['Sábanas', 'Toallas', 'Baño', 'Amenities', 'Minibar'];
const PRI = {1: ['arr', 'Llega alguien hoy'], 2: ['dirty', 'Salida de hoy'], 3: ['occ', 'Repaso · ocupada']};
// Prioridad: 1 llega alguien hoy > 2 salida de hoy / para limpiar > 3 ocupada (repaso). Lo terminado hoy queda al final.
function cleanList() {
  const L = [];
  for (const r of S.rooms) {
    let j = S.limp[r.n];
    if (j && (j.day !== TODAY || (j.min != null && r.dirty))) j = null; // si se volvió a ensuciar, es un trabajo nuevo
    const arr = S.res.some(x => x.room === r.n && x.in === TODAY && x.status === 'confirmada');
    const dep = S.res.some(x => x.room === r.n && x.out === TODAY && x.status === 'adentro');
    const occ = S.res.some(x => x.room === r.n && x.status === 'adentro');
    const p = j ? j.p : r.dirty && arr ? 1 : r.dirty || dep ? 2 : occ ? 3 : 0;
    if (p) L.push({r, p, j, done: j?.min != null});
  }
  return L.sort((a, b) => a.done - b.done || a.p - b.p || a.r.n - b.r.n);
}
const ago = t => Math.max(1, Math.round((Date.now() - t) / 6e4));
function cleanProg() {
  const L = cleanList(), done = L.filter(c => c.done).length, doing = L.filter(c => c.j && !c.done);
  return `<div class="card" id="cleanProg"><h3>Avance de limpieza</h3><div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="${L.length}" aria-valuenow="${done}"><i style="width:${L.length ? done / L.length * 100 : 100}%"></i></div>
    <p class="hint" style="margin:10px 0 0">${done} de ${L.length} habitaciones listas · ${doing.length} en curso${L.find(c => !c.j && c.p === 1) ? ' · <b>hay llegadas de hoy sin empezar</b>' : ''}</p>
    ${doing.length ? '<ul class="lst">' + doing.map(c => `<li><span><b>Hab. ${c.r.n}</b> · ${esc(c.j.who)}</span><small>hace ${ago(c.j.t0)} min · ${c.j.chk.length}/${CHK.length}</small></li>`).join('') + '</ul>' : ''}</div>`;
}
function cleanCard({r, p, j, done}) {
  const [k, t] = PRI[p], left = j ? CHK.filter((_, i) => !j.chk.includes(i)) : [];
  return `<div class="ccard st-${k} ${done ? 'done' : ''}"><div class="ch"><b>${r.n}</b>${pill([k, t])}</div><small>${esc(tname(r.type))}</small>
    ${done ? `<p class="okline">Lista en ${j.min} min · ${esc(j.who)}</p>`
    : j ? `<small>${esc(j.who)} empezó hace ${ago(j.t0)} min</small><div class="ticks">${CHK.map((c, i) => `<button class="tick ${j.chk.includes(i) ? 'on' : ''}" aria-pressed="${j.chk.includes(i)}" onclick="cTick(${r.n},${i})">${c}</button>`).join('')}</div>
      <button class="btn" onclick="cEnd(${r.n})">Terminé${left.length ? ` (faltan ${left.length})` : ''}</button>`
    : `<button class="btn" onclick="cStart(${r.n},${p})">Empecé</button>`}
    <div class="row" style="margin:0"><button class="btn sec sm" onclick="cBroke(${r.n})">Algo roto</button><button class="btn sec sm" onclick="cRopa(${r.n})">Falta ropa blanca</button></div></div>`;
}
function vClean() {
  const L = cleanList(), inc = S.incid.filter(i => !i.done);
  return `<h2>Limpieza</h2><p class="hint">Pensada para una tablet en el office. Cada mucama toca su nombre, después «Empecé» y «Terminé». Recepción ve el avance al instante.</p>
  <div class="toolbar"><span class="seg" role="group" aria-label="Cómo se ve"><button class="${PH ? '' : 'on'}" onclick="PH=0;render()">Pantalla</button><button class="${PH ? 'on' : ''}" onclick="PH=1;render()">Ver en tablet</button></span></div>
  <div class="big ${PH ? 'tablet' : ''}" id="cleanWrap">
    <div class="who-muc"><span>¿Quién sos?</span>${MUC.map(m => `<button class="tick ${S.muc === m ? 'on' : ''}" aria-pressed="${S.muc === m}" onclick="S.muc='${m}';save();render()">${m}</button>`).join('')}</div>
    <div class="ccards">${L.map(cleanCard).join('') || '<p class="hint">¡Todo limpio!</p>'}</div>
    <div class="card" style="margin-top:16px"><h3>Avisos pendientes (${inc.length})</h3>
    ${inc.length ? '<ul class="lst">' + inc.map(i => `<li><div><b>Hab. ${i.room}</b> · ${esc(i.text)}</div><button class="btn sec sm" onclick="fixed(${i.id})">${i.kind === 'ropa' ? 'Repuesto ✓' : 'Arreglado ✓'}</button></li>`).join('') + '</ul>' : '<p class="hint" style="margin:0">Nada pendiente.</p>'}</div></div>`;
}
function cStart(n, p) {
  if (!S.muc) return toast('Primero tocá tu nombre arriba.');
  S.limp[n] = {who: S.muc, t0: Date.now(), day: TODAY, p, chk: []}; save(); render();
}
function cTick(n, i) { const c = S.limp[n].chk, k = c.indexOf(i); k < 0 ? c.push(i) : c.splice(k, 1); save(); render(); }
function cEnd(n, force) {
  const j = S.limp[n], left = CHK.filter((_, i) => !j.chk.includes(i));
  if (left.length && !force) return modal(`<h3>Hab. ${n}: faltan tildar</h3><p>${left.join(', ')}.</p><div class="row"><button class="btn" onclick="closeM();cEnd(${n},1)">Terminar igual</button><button class="btn sec" onclick="closeM()">Volver</button></div>`);
  S.stock.forEach(i => { if (i.use) i.qty = Math.max(0, Math.round((i.qty - i.use) * 10) / 10); }); // cada habitación terminada descuenta insumos
  j.min = ago(j.t0); S.rooms.find(r => r.n === n).dirty = false; save(); render(); toast(`Hab. ${n} lista en ${j.min} min. Recepción ya la ve.`);
}
const quick = (n, title, opts, kind, pre) => modal(`<h3>Hab. ${n} · ${title}</h3><p class="hint">Tocá una opción y listo: le llega a recepción y a la dueña.</p>
  <div class="ticks">${opts.map(o => `<button class="tick" onclick="addInc(${n},'${pre}${o}','${kind}')">${o}</button>`).join('')}</div>
  <form class="form" style="margin-top:14px" onsubmit="event.preventDefault();addInc(${n},'${pre}'+this.t.value.trim(),'${kind}')"><label>Otra cosa<input name="t" required maxlength="60"></label><div class="row" style="margin:0"><button class="btn sm">Avisar</button><button type="button" class="btn sec sm" onclick="closeM()">Cancelar</button></div></form>`);
const cBroke = n => quick(n, 'algo roto', ['No enfría el aire', 'Gotea la canilla', 'No anda la tele', 'Lámpara quemada', 'Inodoro tapado'], 'rotura', '');
const cRopa = n => quick(n, 'falta ropa blanca', ['Sábanas', 'Toallas', 'Toallones', 'Fundas', 'Cubrecama'], 'ropa', 'Falta ropa blanca: ');
function addInc(n, text, kind) { S.incid.push({id: Math.max(0, ...S.incid.map(i => i.id)) + 1, room: n, text, kind, done: false}); save(); closeM(); render(); toast('Aviso enviado. Recepción ya lo ve.'); }
function clean(n) { S.rooms.find(r => r.n === n).dirty = false; save(); render(); toast(`Hab. ${n} lista. Recepción ya la ve libre.`); }
function fixed(id) { S.incid.find(i => i.id === id).done = true; save(); render(); toast('Marcado como arreglado.'); }

let WS = 0;
function vWeb() {
  const c = S.cfg;
  return `<h2>Web del hotel</h2><p class="hint">Así podría encontrarte un turista. Tocá la imagen para abrir la web completa.</p>
  <div class="toolbar"><span class="seg" role="group" aria-label="Secciones de la web">${WEBSHOTS.map(([l], i) => `<button class="${i === WS ? 'on' : ''}" onclick="WS=${i};render()">${l}</button>`).join('')}</span><span class="sp"></span><a class="btn sm" href="https://forgiving-speech-705192.framer.app" target="_blank" rel="noopener">Abrir la web →</a></div>
  <a class="browser" id="webBox" href="https://forgiving-speech-705192.framer.app" target="_blank" rel="noopener" style="display:block;max-width:960px"><div class="bbar">tajy-iguazu-hotel · demo</div><img src="${WEBSHOTS[WS][1]}" alt="Web del hotel: ${WEBSHOTS[WS][0]}" style="display:block;width:100%"></a>
  <div style="max-width:960px;margin-top:16px"><div class="card" id="consulta"><h3>Probá: mandá una consulta como si fueras un turista</h3><p class="hint" style="margin:-6px 0 14px">Aparece sola en <b>Reservas</b>, sin comisión.</p><form class="form form-2" onsubmit="webAsk(event)" style="max-width:640px">
      <label>Tu nombre<input name="name" required maxlength="40"></label><label>WhatsApp o mail<input name="contact" required maxlength="60"></label>
      <label>Llegada<input type="date" name="in" required min="${TODAY}" value="${addDays(TODAY, 7)}"></label><label>Noches<input type="number" name="n" min="1" max="30" value="2" required></label>
      <label>Habitación<select name="type">${c.types.filter(t => t.count).map(t => `<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></label><label>Personas<input type="number" name="pax" min="1" max="10" value="2" required></label>
      <label style="grid-column:1/-1">Mensaje<input name="msg" maxlength="120" placeholder="¿Algo que debamos saber?"></label>
      <div><button class="btn">Enviar consulta</button></div></form></div></div>`;
}
function webAsk(ev) {
  ev.preventDefault(); const f = Object.fromEntries(new FormData(ev.target));
  S.consultas.push({id: Math.max(0, ...S.consultas.map(c => c.id)) + 1, name: f.name.trim(), contact: f.contact.trim(), in: f.in, n: Math.max(1, +f.n | 0), type: f.type, pax: +f.pax, msg: f.msg.trim(), done: false});
  save(); ev.target.reset(); toast('Consulta enviada. Mirá la pestaña Reservas: ya está ahí.');
}

const QA = [
  ['¿Cómo viene el mes?', () => { const m = month(), o = Math.round(m.occ * 100); return `Este mes la ocupación viene en ${o}% y los ingresos suman ${ars(m.rev)} (${usd(m.rev)}).\nEl precio promedio por noche es ${ars(m.adr)}.\n\n${o < 60 ? 'Hay lugar para crecer. Te sugiero: ofrecer una tarifa especial a las empresas con convenio para los días flojos y publicar una promo en Instagram con link a la web.' : 'Va muy bien. Con esta demanda, podés subir un poco la tarifa en los fines de semana sin perder huéspedes.'}`; }],
  ['¿Qué canal me deja más plata?', () => { const m = month(), net = Object.entries(m.byCh).map(([c, v]) => [c, (c === 'Booking' || c === 'Despegar') ? v * (1 - S.cfg.comm / 100) : v]).sort((a, b) => b[1] - a[1]); return `Lo que te queda en el bolsillo este mes, ya descontadas las comisiones:\n${net.map(([c, v]) => `• ${c}: ${ars(v)}`).join('\n')}\n\nLas reservas directas, por web y de empresas no pagan comisión: conviene empujar esas.`; }],
  ['¿Cuánto le pago a Booking y Despegar?', () => { const m = month(); return `Este mes, cerca de ${ars(m.comm)} en comisiones (${S.cfg.comm}%).\nSi sigue igual, en un año serían unos ${ars(m.comm * 12)}.\n\nSi 2 de cada 10 de esas reservas pasaran a la web propia, ahorrarías unos ${ars(m.comm * 12 * .2)} por año.`; }],
  ['Ayudame a responder una consulta', () => `Te dejo una respuesta lista para copiar:\n\n"¡Hola! Gracias por escribirnos. Para esas fechas tenemos disponible una habitación Cuádruple superior (35 m², hasta 4 personas) a ${ars(typeOf('cs').rate)} por noche, con desayuno incluido. Si querés, te la reservamos con una seña. ¡Te esperamos en ${S.cfg.name}!"\n\nSi me pasás la consulta exacta, la adapto.`],
  ['¿Qué precio pongo para un fin de semana largo?', () => `Algunas ideas:\n• Subí entre 15% y 25% sobre la tarifa normal: la demanda en Iguazú se dispara esos días.\n• Pedí un mínimo de 2 noches.\n• Mirá a qué precio están hoteles parecidos de la zona en Booking.\n\nEs una sugerencia: la decisión final siempre es tuya.`],
];
function vAI() {
  return `<h2>Tu asistente</h2><p class="hint">Muestra simulada. El asistente real sería <b>Claude</b>: le preguntás con tus palabras y responde con los datos del hotel. Para impuestos, siempre se confirma con el contador.</p>
  <div class="card" id="aiCard"><div class="chips">${QA.map((q, i) => `<button class="chip" onclick="ask(${i})">${q[0]}</button>`).join('')}</div>
    <div class="chat" id="chat">${CHAT.length ? CHAT.map(([w, t]) => `<div class="msg ${w}">${esc(t)}</div>`).join('') : '<p class="hint">Tocá una pregunta de arriba o escribí la tuya.</p>'}</div>
    <form onsubmit="askFree(event)" style="display:flex;gap:8px"><input name="q" placeholder="Escribí tu pregunta…" style="flex:1;min-width:0;padding:10px;font:inherit;border:1px solid var(--line);border-radius:8px" required><button class="btn">Preguntar</button></form></div>`;
}
function ask(i) { CHAT.push(['me', QA[i][0]], ['ai', QA[i][1]()]); render(); const c = $('#chat'); c.scrollTop = c.scrollHeight; }
function askFree(ev) { ev.preventDefault(); const q = new FormData(ev.target).get('q'); CHAT.push(['me', q], ['ai', 'En la versión real, Claude te responde cualquier pregunta usando los datos del hotel. En esta muestra, probá las preguntas de arriba']); render(); }

let FP = 'mes';
function period() {
  const m0 = TODAY.slice(0, 8) + '01', d = new Date(TODAY + 'T12:00'), m1 = ymd(new Date(d.getFullYear(), d.getMonth() + 1, 1)), p0 = ymd(new Date(d.getFullYear(), d.getMonth() - 1, 1));
  return {mes: [m0, addDays(TODAY, 1), 'Este mes hasta hoy'], cierre: [m0, m1, 'Este mes completo (con lo ya reservado)'], prev: [p0, m0, 'Mes anterior']}[FP];
}
function vFin() {
  const [a, b, lbl] = period(), days = diff(a, b), s = stats(a, b), f = pl(s, days), cap = S.rooms.length * days;
  const rows = [['Lo que entró (sin IVA)', f.neto, 0], ['Comisión de Booking y Despegar', -f.comm, 1], ['Impuestos sobre ventas (' + S.cfg.iibb + '%)', -f.iibb, 1], ['Gastos por huésped (' + s.rn + ' noches)', -f.vari, 1], ['Gastos fijos (sueldos, luz…)', -f.fijos, 1]];
  let cum = f.neto; const wf = rows.map(([l, v, neg]) => { const w = Math.abs(v) / f.neto * 100, left = neg ? (cum += v) / f.neto * 100 : 0; return `<div class="wf"><span>${l}</span><div><i style="margin-left:${Math.max(0, left)}%;width:${w}%;background:${neg ? 'var(--bad)' : 'var(--c2)'}"></i></div><em>${neg ? '− ' : ''}${ars(Math.abs(v))}</em></div>`; }).join('')
    + `<div class="wf tot"><span>Ganancia</span><div><i style="width:${Math.abs(f.res) / f.neto * 100}%;background:${f.res >= 0 ? 'var(--ok)' : 'var(--bad)'}"></i></div><em>${ars(f.res)}</em></div>`;
  const types = S.cfg.types.filter(t => t.count).map(t => { let rn = 0, rev = 0; for (const x of S.res) { if (x.status === 'cancelada' || roomType(x.room) !== t.id) continue; const n = Math.max(0, diff(x.in > a ? x.in : a, x.out < b ? x.out : b)); rn += n; rev += n * x.total / diff(x.in, x.out); } return {t, rn, rev, occ: rn / (t.count * days)}; });
  const varN = S.cfg.vari.reduce((x, v) => x + v[1], 0), bm = stats(TODAY.slice(0, 8) + '01', ymd(new Date(+TODAY.slice(0, 4), +TODAY.slice(5, 7), 1)));
  return `<h2>Ganancias</h2><p class="hint">Cuánta plata queda después de pagar todo. Los gastos son estimados: se cambian en Personalización.</p>
  ${verdict(f.res < 0 ? 'bad' : f.marg < .15 ? 'warn' : 'ok', `${lbl}: el hotel ${f.res >= 0 ? 'ganó' : 'perdió'} ${mill(Math.abs(f.res))}.`, `De cada $ 100 que entraron, quedaron $ ${Math.max(0, Math.round(f.marg * 100))} de ganancia. Para no perder plata hace falta llenar el ${Math.round(f.be / cap * 100)}% de las habitaciones, y vas en ${Math.round(s.occ * 100)}%.`)}
  <div class="toolbar"><span class="seg" role="group" aria-label="Período">${[['mes', 'Mes a hoy'], ['cierre', 'Mes completo'], ['prev', 'Mes anterior']].map(([k, l]) => `<button class="${FP === k ? 'on' : ''}" onclick="FP='${k}';render()">${l}</button>`).join('')}</span><small class="mut">${lbl} · ${fdate(a)} al ${fdate(addDays(b, -1))}</small></div>
  <div class="grid" id="finKpis">${kpi(ars(f.res), 'Ganancia', `Quedan $ ${Math.max(0, Math.round(f.marg * 100))} de cada $ 100 que entran.`)}${kpi(ars(f.neto / cap), 'Lo que deja cada habitación por noche', 'Contando también las noches que quedó vacía.')}${kpi(ars(f.cpor), 'Lo que cuesta cada noche vendida', 'Sueldos, luz, desayuno, lavandería y demás, repartidos.')}${kpi(Math.round(f.be / cap * 100) + '%', 'Ocupación mínima para no perder plata', `Este período vas en ${Math.round(s.occ * 100)}%.`)}</div>
  <div class="card" id="wfCard"><h3>De lo que entra a lo que queda</h3>${wf}</div>
  <details class="card calwrap fin-tbl"><summary>Detalle para el contador ${pill(['warn', 'Estimado'])}</summary><table class="tbl" style="margin-top:12px"><tr><th>Concepto</th><th style="text-align:right">Pesos</th><th style="text-align:right">% ventas</th></tr>
    <tr><td>Ventas brutas (con IVA)</td><td style="text-align:right">${ars(s.rev)}</td><td></td></tr><tr><td>IVA 21% (no es del hotel)</td><td style="text-align:right">− ${ars(s.rev - f.neto)}</td><td></td></tr>
    ${rows.map(([l, v]) => `<tr><td>${l}</td><td style="text-align:right">${v < 0 ? '− ' : ''}${ars(Math.abs(v))}</td><td style="text-align:right">${Math.round(Math.abs(v) / f.neto * 100)}%</td></tr>`).join('')}
    <tr><th>Ganancia</th><th style="text-align:right">${ars(f.res)}</th><th style="text-align:right">${Math.round(f.marg * 100)}%</th></tr><tr><td>En dólares</td><td style="text-align:right">${usd(f.res)}</td><td></td></tr></table></details>
  <div class="card" id="simCard"><h3>Probá: ¿qué pasa si…?</h3><p class="hint">Tocá una pregunta o mové los controles. Muestra la ganancia de un mes completo, partiendo de cómo viene este mes.</p>
    <div class="chips" style="margin-bottom:18px">${[['…subo 10% el precio?', 's-tar', 10], ['…lleno 10% más de habitaciones?', 's-occ', 10], ['…bajo 10% los gastos fijos?', 's-fij', -10], ['…la mitad reserva por la web propia?', 's-dir', 20]].map(([l, id, v]) => `<button class="chip" onclick="simQ('${id}',${v})">${l}</button>`).join('')}<button class="chip" onclick="simQ()">Volver a como está hoy</button></div>
    <div class="sim"><div class="form">
      <label>Habitaciones llenas <output id="so">${Math.round(bm.occ * 100)}%</output><input type="range" id="s-occ" min="20" max="100" value="${Math.round(bm.occ * 100)}" oninput="sim()"></label>
      <label>Precio por noche <output id="st">+0%</output><input type="range" id="s-tar" min="-30" max="40" value="0" oninput="sim()"></label>
      <label>Gastos fijos <output id="sf">+0%</output><input type="range" id="s-fij" min="-25" max="25" value="0" oninput="sim()"></label>
      <label>Reservas por la web propia (sin comisión) <output id="sd">+0 pts</output><input type="range" id="s-dir" min="0" max="40" value="0" oninput="sim()"></label></div>
    <div id="simOut" aria-live="polite"></div></div></div>
  <div class="card calwrap"><h3>Por tipo de habitación</h3><table class="tbl"><tr><th>Tipo</th><th>Cant.</th><th>Noches vendidas</th><th>Ocupación</th><th>Precio promedio</th><th>Venta neta</th><th>Aporte (después de variables)</th></tr>
    ${types.map(o => `<tr><td>${esc(o.t.name)}</td><td>${o.t.count}</td><td>${o.rn}</td><td><div class="mini"><i style="width:${Math.round(o.occ * 100)}%"></i></div>${Math.round(o.occ * 100)}%</td><td>${ars(o.rn ? o.rev / o.rn : 0)}</td><td>${ars(o.rev / 1.21)}</td><td>${ars(o.rev / 1.21 * (1 - S.cfg.iibb / 100) - o.rn * varN)}</td></tr>`).join('')}</table></div>`;
}
function simQ(id, v) {
  if (!id) { ['s-occ', 's-tar', 's-fij', 's-dir'].forEach(k => $('#' + k).value = $('#' + k).defaultValue); return sim(); }
  const e = $('#' + id); e.value = Math.min(+e.max, Math.max(+e.min, +e.value + v)); sim();
}
// Simulador: mes completo con los números de este mes como base.
function sim() {
  const m0 = TODAY.slice(0, 8) + '01', m1 = ymd(new Date(+TODAY.slice(0, 4), +TODAY.slice(5, 7), 1)), days = diff(m0, m1), b = stats(m0, m1);
  const occ = +$('#s-occ').value / 100, tar = +$('#s-tar').value / 100, fij = +$('#s-fij').value / 100, dir = +$('#s-dir').value / 100;
  const rn = Math.round(occ * S.rooms.length * days), rev = rn * (b.adr || 1) * (1 + tar), cr = b.rev ? b.comm / b.rev : 0;
  const c = {...S.cfg, fijos: S.cfg.fijos.map(([k, v]) => [k, v * (1 + fij)])}, base = pl(b, days), f = pl({rev, rn, comm: rev * Math.max(0, cr - dir * S.cfg.comm / 100)}, days, c);
  $('#so').textContent = Math.round(occ * 100) + '%'; $('#st').textContent = (tar >= 0 ? '+' : '') + Math.round(tar * 100) + '%'; $('#sf').textContent = (fij >= 0 ? '+' : '') + Math.round(fij * 100) + '%'; $('#sd').textContent = '+' + Math.round(dir * 100) + ' pts';
  const d = f.res - base.res, mx = Math.max(Math.abs(f.res), Math.abs(base.res), 1);
  $('#simOut').innerHTML = `<div class="simbig"><span class="l">Ganancia del mes</span><b class="${f.res < 0 ? 'neg' : ''}">${ars(f.res)}</b>${pill([d >= 0 ? 'ok' : 'bad', (d >= 0 ? '↑ ' : '↓ ') + ars(Math.abs(d)) + ' contra hoy'])}</div>
    <div class="cmp"><div><span>Hoy</span><i style="width:${Math.abs(base.res) / mx * 100}%"></i><em>${ars(base.res)}</em></div><div><span>Simulado</span><i class="${f.res < 0 ? 'bad' : ''}" style="width:${Math.abs(f.res) / mx * 100}%"></i><em>${ars(f.res)}</em></div></div>
    <p class="hint" style="margin:12px 0 0">Entrarían ${mill(f.neto)} sin IVA y quedarían $ ${Math.max(0, Math.round(f.marg * 100))} de cada $ 100. Para no perder plata: ${Math.round(f.be / (S.rooms.length * days) * 100)}% de ocupación.</p>`;
}

function flujo(n = 30) {
  let b = S.banco + CASH.reduce((s, m) => s + toARS(m, cajaEsp(m)), 0) + S.ing.filter(i => !i.acred).reduce((s, i) => s + i.ars, 0);
  const out = [];
  for (let i = 0; i < n; i++) {
    const d = addDays(TODAY, i), inc = S.res.filter(x => (x.status === 'adentro' || x.status === 'confirmada') && x.out === d).reduce((s, x) => s + bal(x), 0);
    const pay = S.prov.filter(p => !p.pagado && (i ? p.vence === d : p.vence <= d)).reduce((s, p) => s + p.monto, 0);
    b += inc - pay; out.push({d, inc, pay, b});
  }
  return out;
}
function vPagos() {

  const venc = pend.filter(p => p.vence < TODAY), sem = pend.filter(p => p.vence >= TODAY && p.vence <= addDays(TODAY, 7));
  return `<h2>Pagos a proveedores</h2><p class="hint">Qué hay que pagar y cuánta plata vas a tener cada día del próximo mes.</p>
  ${verdict(low.b < 0 ? 'bad' : venc.length ? 'warn' : 'ok', low.b < 0 ? `Ojo: el ${fdate(low.d)} no alcanza la plata.` : venc.length ? `Hay ${venc.length} factura(s) vencida(s) para pagar hoy.` : 'Alcanza la plata para todo lo del próximo mes.', `Cuenta lo que hay en el banco, en la caja y lo que falta cobrar de las reservas. El día más justo es el ${fdate(low.d)}, con ${ars(low.b)}.`)}
  <div class="grid">${kpi(ars(S.banco), 'Saldo en el banco', 'Se actualiza al acreditar cobros y pagar por transferencia.')}${kpi(ars(pend.reduce((s, p) => s + p.monto, 0)), 'Por pagar', `${pend.length} factura(s) de proveedores.`)}${kpi(venc.length, 'Vencidas', venc.length ? pill(['bad', ars(venc.reduce((s, p) => s + p.monto, 0))]) + ' para pagar hoy.' : 'Nada vencido.')}${kpi(ars(low.b), 'El día más justo', `El ${fdate(low.d)}. ${low.b < 0 ? 'Falta plata: conviene adelantar cobros.' : 'Alcanza para todo.'}`)}</div>
  <div class="card" id="flujoCard"><h3>Cuánta plata vas a tener cada día ${pill(['warn', 'Solo con lo ya reservado'])}</h3>
    <div class="chart flow">${fl.map(x => `<div title="${fdate(x.d)}: ${ars(x.b)}${x.inc ? ' · entra ' + ars(x.inc) : ''}${x.pay ? ' · sale ' + ars(x.pay) : ''}"><i class="${x.b < 0 ? 'neg' : ''} ${x.pay ? 'pay' : ''}" style="height:${Math.max(2, Math.abs(x.b) / mx * 100)}%"></i>${fdate(x.d)}</div>`).join('')}</div>
    <div class="legend" style="margin:12px 0 0"><span><i style="--sc:var(--c2)"></i>Plata disponible (banco + caja + tarjetas por llegar)</span><span><i style="--sc:var(--warn)"></i>Día con pagos</span><span><i style="--sc:var(--bad)"></i>Saldo negativo</span></div></div>
  <div class="two"><div class="card calwrap" id="provCard"><h3>Facturas por pagar</h3><table class="tbl"><tr><th>Proveedor</th><th>Vence</th><th style="text-align:right">Importe</th><th></th></tr>
    ${pend.map(p => `<tr><td>${esc(p.name)}<br><small>${esc(p.cat)}</small></td><td>${p.vence < TODAY ? pill(['bad', 'Vencida ' + fdate(p.vence)]) : p.vence <= addDays(TODAY, 7) ? pill(['warn', fdate(p.vence)]) : fdate(p.vence)}</td><td style="text-align:right">${ars(p.monto)}</td><td><button class="btn sm" onclick="pagar(${p.id})">Pagar</button></td></tr>`).join('') || '<tr><td colspan="4">No hay nada por pagar.</td></tr>'}</table>
    <p class="hint" style="margin:10px 0 0">${sem.length} vence(n) esta semana.</p></div>

    <label>Proveedor<input name="name" required maxlength="40" placeholder="Ej.: lavandería"></label>
    <div class="form form-2"><label>Rubro<select name="cat">${['Servicios', 'Desayuno', 'Lavandería', 'Insumos', 'Mantenimiento', 'Sueldos', 'Impuestos', 'Otros'].map(k => `<option>${k}</option>`).join('')}</select></label>
    <label>Importe<input name="monto" type="number" min="1" required></label></div>
    <label>Vence<input name="vence" type="date" required value="${addDays(TODAY, 10)}"></label>
    <div><button class="btn">Cargar factura</button></div></form>
    ${S.prov.some(p => p.pagado) ? `<h3 style="margin-top:18px">Pagadas</h3><ul class="lst">${S.prov.filter(p => p.pagado).slice(-4).reverse().map(p => `<li><span>${esc(p.name)}</span><small>${ars(p.monto)} · ${p.medio === 'caja' ? 'efectivo' : 'transferencia'}</small></li>`).join('')}</ul>` : ''}</div></div>`;
}
function pagar(id) {
  const p = S.prov.find(x => x.id === id);
  modal(`<h3>Pagar · ${esc(p.name)}</h3><p>Importe: <b>${ars(p.monto)}</b> · vence ${fdate(p.vence)}</p><div class="row">
    <button class="btn" onclick="doPagar(${id},'banco')">Transferencia (banco: ${ars(S.banco)})</button><button class="btn sec" onclick="doPagar(${id},'caja')">Efectivo de la caja</button><button class="btn sec" onclick="closeM()">Cancelar</button></div>`);
}
function doPagar(id, medio) {
  const p = S.prov.find(x => x.id === id); p.pagado = true; p.medio = medio;
  if (medio === 'caja') S.caja.movs.push({t: 'Pago ' + p.name, m: 'ARS', imp: -p.monto, cat: p.cat === 'Sueldos' ? 'Sueldos y adelantos' : 'Proveedores'}); else S.banco -= p.monto;
  save(); closeM(); render(); toast(`Pagado: ${p.name}, ${ars(p.monto)}${medio === 'caja' ? '. Salió de la caja del turno.' : ' por transferencia.'}`);
}
function addProv(ev) { ev.preventDefault(); const f = Object.fromEntries(new FormData(ev.target)); S.prov.push({id: Math.max(0, ...S.prov.map(p => p.id)) + 1, name: f.name.trim(), cat: f.cat, monto: Math.round(+f.monto), vence: f.vence, pagado: false}); save(); render(); toast('Factura cargada. Ya aparece en el flujo de fondos.'); }

const stTag = i => i.qty <= 0 ? ['bad', 'Sin stock'] : i.qty < i.min ? ['warn', 'Reponer'] : ['ok', 'Bien'];
const toBuy = i => Math.max(0, Math.ceil(i.min * 2 - i.qty));
function vStock() {
  const perDay = Math.max(1, stats(addDays(TODAY, -14), TODAY).rn / 14), low = S.stock.filter(i => i.qty < i.min);
  const am = S.stock.filter(i => i.use).map(i => i.qty / (i.use * perDay)), cats = [...new Set(S.stock.map(i => i.cat))];
  return `<h2>Stock</h2><p class="hint">Insumos, minibar, desayuno y ropa blanca. Cada habitación que limpieza marca como terminada descuenta amenities solos. Cuando algo baja del mínimo, aparece para reponer.</p>

  <div class="toolbar"><button class="btn sm" onclick="pedido()" ${low.length ? '' : 'disabled'}>Armar pedido de reposición</button></div>
  <div class="card calwrap" id="stockCard"><table class="tbl"><tr><th>Producto</th><th>Stock</th><th>Mínimo</th><th>Rinde</th><th>Estado</th><th>Ajustar</th></tr>
    ${cats.map(c => `<tr><td colspan="6" class="grp">${esc(c)}</td></tr>` + S.stock.filter(i => i.cat === c).map(i => `<tr><td>${esc(i.name)}<br><small>${ars(i.cost)} por ${esc(i.u.replace(/s$/, ''))}</small></td>
      <td><div class="mini ${stTag(i)[0]}"><i style="width:${Math.min(100, i.qty / (i.min * 2) * 100)}%"></i></div>${i.qty} ${esc(i.u)}</td><td>${i.min}</td>
      <td>${i.use ? Math.floor(i.qty / (i.use * perDay)) + ' días' : '—'}</td><td>${pill(stTag(i))}</td>
      <td><span class="stepper"><button aria-label="Restar ${esc(i.name)}" onclick="stAdj(${i.id},-1)">−</button><input type="number" min="0" value="${i.qty}" aria-label="Stock de ${esc(i.name)}" onchange="stAdj(${i.id},(+this.value||0)-${i.qty})"><button aria-label="Sumar ${esc(i.name)}" onclick="stAdj(${i.id},1)">+</button></span></td></tr>`).join('')).join('')}</table></div>`;
}
function stAdj(id, d) { const i = S.stock.find(x => x.id === id); i.qty = Math.max(0, Math.round((i.qty + d) * 10) / 10); save(); render(); }
function pedido() {
  const l = S.stock.filter(i => i.qty < i.min), tot = l.reduce((s, i) => s + toBuy(i) * i.cost, 0);
  modal(`<h3>Pedido de reposición</h3><p class="hint">Lleva cada producto al doble del mínimo. Total estimado: <b>${ars(tot)}</b>.</p>
    <textarea id="ped-out" rows="${l.length + 4}" readonly>Hola, te paso el pedido de ${S.cfg.name}:\n${l.map(i => `• ${toBuy(i)} ${i.u} de ${i.name}`).join('\n')}\n¡Gracias!</textarea>
    <div class="row"><button class="btn" onclick="copyTxt('#ped-out')">Copiar para WhatsApp</button><button class="btn sec" onclick="recibir()">Ya llegó: sumar al stock</button><button class="btn sec" onclick="closeM()">Cerrar</button></div>`);
}
function recibir() {
  const l = S.stock.filter(i => i.qty < i.min), tot = l.reduce((s, i) => s + toBuy(i) * i.cost, 0);
  l.forEach(i => i.qty += toBuy(i));
  S.prov.push({id: Math.max(0, ...S.prov.map(p => p.id)) + 1, name: 'Compra de reposición', cat: 'Insumos', monto: Math.round(tot), vence: addDays(TODAY, 15), pagado: false});
  save(); closeM(); render(); toast(`Stock repuesto. La factura de ${ars(tot)} quedó en Proveedores, vence el ${fdate(addDays(TODAY, 15))}.`);
}

// ---------- caja ----------
const DEN = {ARS: [20000, 10000, 2000, 1000, 500, 200, 100], USD: [100, 50, 20, 10, 5, 1], BRL: [200, 100, 50, 20, 10, 5, 2]};
const MON = {ARS: ['$', 'Pesos'], USD: ['US$', 'Dólares'], BRL: ['R$', 'Reales']};
const money = (m, n) => MON[m][0] + ' ' + Math.round(n).toLocaleString('es-AR');
const cajaEsp = m => S.caja.ap[m] + S.caja.movs.filter(v => v.m === m).reduce((s, v) => s + v.imp, 0);
const cajaCnt = m => DEN[m].reduce((s, d) => s + d * (S.caja.cnt[m + d] || 0), 0);
function totHtml(m) {
  const e = cajaEsp(m), k = cajaCnt(m), d = k - e;
  return `<div class="tot"><span>Contado</span><span>${money(m, k)}</span></div>
    <div class="tot" style="border:0;margin:0;font-weight:400"><span>Debería haber</span><span>${money(m, e)}</span></div>
    <div class="tot" style="border:0;margin:0"><span>Diferencia</span><span class="${d < 0 ? 'neg' : d > 0 ? 'pos' : ''}">${d ? (d > 0 ? 'Sobran ' : 'Faltan ') + money(m, Math.abs(d)) : 'Justo ✓'}</span></div>`;
}
const CASH = Object.keys(DEN);
const CAT_IN = ['Estadía', 'Seña', 'Saldo', 'Extras (minibar, lavandería)', 'Otros ingresos'];
const CAT_OUT = ['Proveedores', 'Compras del día', 'Sueldos y adelantos', 'Mantenimiento', 'Retiro de la dueña', 'Otros gastos'];
const toARS = (m, n) => n * FX[m]();
// Todo cobro queda registrado; si es efectivo entra además a la caja del turno en su moneda. Tarjetas y transferencias quedan "por acreditar".
function ingreso(t, cat, pay, ars) {
  S.ing.push({id: S.ing.length + 1, fecha: TODAY, t, cat, pay, ars, acred: !!FX[pay]});
  if (FX[pay]) S.caja.movs.push({t, m: pay, imp: Math.round(ars / FX[pay]()), cat});
}
function cajaRes(movs) {
  const by = {}; let inn = 0, out = 0;
  for (const v of movs) { const a = toARS(v.m, v.imp), k = v.cat || (v.imp > 0 ? 'Otros ingresos' : 'Otros gastos'); by[k] = (by[k] || 0) + a; a > 0 ? inn += a : out -= a; }
  return {by, inn, out};
}
function vCaja() {
  const c = S.caja, r = cajaRes(c.movs), pend = S.ing.filter(i => !i.acred), esp = CASH.reduce((s, m) => s + toARS(m, cajaEsp(m)), 0);
  const cats = Object.entries(r.by).sort((a, b) => Math.abs(b[1]) - Math.abs(a[1])), mx = Math.max(1, ...cats.map(v => Math.abs(v[1])));
  return `<h2>Caja</h2><p class="hint">Turno ${esc(c.turno)} · Anotá lo que entra y sale. Al final del turno se cuentan los billetes y el sistema dice si falta o sobra.</p>
  ${verdict(pend.length ? 'warn' : 'ok', `En este turno entró ${ars(r.inn)} y salió ${ars(r.out)}.`, `En la caja tendría que haber ${ars(esp)}, sumando pesos, dólares y reales.${pend.length ? ` Hay ${pend.length} cobro(s) con tarjeta que todavía no llegaron al banco.` : ''}`)}
  <div class="grid">${kpi(ars(r.inn), 'Entró en el turno', 'Todo convertido a pesos.')}${kpi(ars(r.out), 'Salió en el turno', 'Pagos, compras y retiros.')}${kpi(ars(esp), 'Debería haber en caja', `Pesos, dólares (${ars(S.cfg.fx)}) y reales (${ars(S.cfg.brl)}), en pesos.`)}${kpi(ars(pend.reduce((s, i) => s + i.ars, 0)), 'Falta que llegue al banco', `${pend.length} cobro(s) con tarjeta o transferencia.`)}</div>
  <div class="cash" id="cashCard">${CASH.map(m => `<div class="card"><h3>Contá los billetes · ${MON[m][1]}</h3>
    ${DEN[m].map(v => `<label class="den"><span>${money(m, v)}</span><input type="number" min="0" inputmode="numeric" value="${c.cnt[m + v] || ''}" placeholder="0" aria-label="Billetes de ${money(m, v)}" oninput="setCnt('${m}',${v},this.value)"><em id="e-${m}${v}">${money(m, v * (c.cnt[m + v] || 0))}</em></label>`).join('')}
    <div id="tot-${m}">${totHtml(m)}</div></div>`).join('')}</div>
  <div class="two"><div class="card calwrap"><h3>Movimientos del turno</h3><table class="tbl"><tr><th>Concepto</th><th>Categoría</th><th style="text-align:right">Importe</th></tr>
    <tr><td>Fondo inicial</td><td><small>Apertura</small></td><td style="text-align:right"><small>${CASH.map(m => money(m, c.ap[m])).join(' · ')}</small></td></tr>
    ${c.movs.map(v => `<tr><td>${esc(v.t)}</td><td>${pill([v.imp < 0 ? 'bad' : 'ok', esc(v.cat || '—')])}</td><td style="text-align:right" class="${v.imp < 0 ? 'neg' : ''}">${v.imp < 0 ? '− ' : ''}${money(v.m, Math.abs(v.imp))}</td></tr>`).join('')}</table>
    <form class="form form-2" onsubmit="addMov(event)" style="margin-top:14px"><label>Concepto<input name="t" required maxlength="40" placeholder="Ej.: pago de lavandería"></label>
    <label>Categoría<select name="cat"><optgroup label="Entra plata">${CAT_IN.map(k => `<option>${k}</option>`).join('')}</optgroup><optgroup label="Sale plata">${CAT_OUT.map(k => `<option>${k}</option>`).join('')}</optgroup></select></label>
    <label>Moneda<select name="m">${CASH.map(m => `<option value="${m}">${MON[m][1]}</option>`).join('')}</select></label>

    <div style="grid-column:1/-1"><button class="btn sm">Anotar movimiento</button></div></form></div>
  <div><div class="card"><h3>Por categoría (en pesos)</h3><div class="bars">${cats.map(([k, v]) => `<div><span>${esc(k)}</span><i style="width:${Math.max(3, Math.abs(v) / mx * 60)}%;background:${v < 0 ? 'var(--bad)' : 'var(--ok)'}"></i><em>${v < 0 ? '− ' : ''}${ars(Math.abs(v))}</em></div>`).join('') || '<p class="hint">Sin movimientos.</p>'}</div></div>
    <div class="card" id="acredCard"><h3>Cobros con tarjeta que todavía no llegaron al banco</h3>${pend.length ? '<ul class="lst">' + pend.map(i => `<li><div>${esc(i.t)}<br><small>${fdate(i.fecha)} · ${i.pay === 'ext' ? 'Tarjeta del exterior' : 'Tarjeta o transferencia'}</small></div><span><b>${ars(i.ars)}</b> <button class="btn sec sm" onclick="acred(${i.id})">Ya llegó ✓</button></span></li>`).join('') + '</ul>' : '<p class="hint" style="margin:0">Ya llegó todo al banco.</p>'}</div></div></div>
  <div class="card"><h3>Cerrar el turno</h3><p class="hint">Al cerrar, lo contado pasa a ser el fondo del turno siguiente y sale un resumen para imprimir o guardar.</p>
    <button class="btn" onclick="closeShift()">Cerrar turno ${esc(c.turno)}</button>
    ${c.cierres.length ? `<h3 style="margin-top:16px">Últimos cierres</h3><ul class="lst">${c.cierres.slice(-5).reverse().map((z, i) => `<li><span>${fdate(z.fecha)} · ${esc(z.turno)}</span><span><small>${CASH.map(m => `${MON[m][1]}: ${z.dif[m] ? (z.dif[m] > 0 ? 'sobraron ' : 'faltaron ') + money(m, Math.abs(z.dif[m])) : 'justo'}`).join(' · ')}</small> ${z.by ? `<button class="btn sec sm" onclick="zRep(${c.cierres.length - 1 - i})">Ver resumen</button>` : ''}</span></li>`).join('')}</ul>` : ''}</div>`;
}
function acred(id) { S.ing.find(i => i.id === id).acred = true; S.banco += S.ing.find(i => i.id === id).ars; save(); render(); toast('Listo: ya suma a la plata del banco.'); }
function zRep(i) {
  const z = S.caja.cierres[i];
  modal(`<div class="inv"><div class="invh"><div><b>${esc(S.cfg.name)}</b><br><small>Cierre de caja · turno ${esc(z.turno)}</small></div><div style="text-align:right">${fdate(z.fecha)}<br><small>${esc(z.hora || '')}</small></div></div>
    <table class="tbl"><tr><th>Moneda</th><th>Debía haber</th><th>Contado</th><th>Diferencia</th></tr>
    ${CASH.map(m => `<tr><td>${MON[m][1]}</td><td>${money(m, z.ap[m] - z.dif[m])}</td><td>${money(m, z.ap[m])}</td><td class="${z.dif[m] < 0 ? 'neg' : z.dif[m] > 0 ? 'pos' : ''}">${z.dif[m] ? money(m, z.dif[m]) : 'Justo'}</td></tr>`).join('')}</table>
    <table class="tbl" style="margin-top:10px"><tr><th>Categoría</th><th>En pesos</th></tr>${Object.entries(z.by).map(([k, v]) => `<tr><td>${esc(k)}</td><td>${v < 0 ? '− ' : ''}${ars(Math.abs(v))}</td></tr>`).join('')}
    <tr><th>Entró</th><th>${ars(z.inn)}</th></tr><tr><th>Salió</th><th>${ars(z.out)}</th></tr></table>
    <p><small>Firma de quien entrega: ____________ · Firma de quien recibe: ____________</small></p></div>
    <div class="row noprint"><button class="btn" onclick="print()">Imprimir o guardar PDF</button><button class="btn sec" onclick="closeM()">Cerrar</button></div>`);
}
function setCnt(m, v, n) { S.caja.cnt[m + v] = Math.max(0, n | 0); save(); $('#e-' + m + v).textContent = money(m, v * S.caja.cnt[m + v]); $('#tot-' + m).innerHTML = totHtml(m); }
function addMov(ev) {
  ev.preventDefault(); const f = Object.fromEntries(new FormData(ev.target)), n = Math.abs(Math.round(+f.imp));
  if (!n) return toast('Poné un importe mayor a cero.');
  S.caja.movs.push({t: f.t.trim(), m: f.m, imp: CAT_OUT.includes(f.cat) ? -n : n, cat: f.cat}); save(); render(); toast('Movimiento anotado.');
}
function closeShift() {
  const c = S.caja, ap = {}, dif = {};
  if (!Object.keys(DEN).some(cajaCnt)) return toast('Primero contá los billetes de cada moneda.');
  for (const m in DEN) { ap[m] = cajaCnt(m); dif[m] = ap[m] - cajaEsp(m); }
  const r = cajaRes(c.movs);
  c.cierres.push({fecha: TODAY, hora: new Date().toLocaleTimeString('es-AR', {hour: '2-digit', minute: '2-digit'}), turno: c.turno, dif, ap, by: r.by, inn: r.inn, out: r.out});
  Object.assign(c, {ap, movs: [], cnt: {}, turno: {Mañana: 'Tarde', Tarde: 'Noche'}[c.turno] || 'Mañana'});
  save(); render(); zRep(c.cierres.length - 1);
}

  $('#hLogo').src = logo(); $('#hName').textContent = c.name; $('#hSub').textContent = c.sub;}
function go(tab) { if (!PERF[P][1].includes(tab)) P = 'duena'; cur = tab; render(); window.scrollTo(0, 0); }
function setPerfil(p) { P = p; try { localStorage.setItem(KEY + '-perfil', p); } catch (e) {} go(PERF[p][1][0]); }
const GROUPS = [['Hoy', ['duena', 'recepcion', 'rack', 'limpieza']], ['Reservas', ['reservas', 'huespedes', 'conserjeria']], ['Plata', ['caja', 'cobros', 'pagos', 'finanzas']], ['Hotel', ['stock', 'web', 'asistente', 'config']]];
let lastTab = '';
// Los números grandes suben desde cero al entrar a una pantalla (no al tocar botones dentro de ella).
function countUp() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  document.querySelectorAll('.kpi b').forEach(b => {
    const m = b.textContent.match(/^(\D*)([\d.]+)(\D*)$/); if (!m) return;
    const n = +m[2].replace(/\./g, ''), t0 = performance.now();
    const step = t => { const k = Math.min(1, (t - t0) / 750), e = 1 - (1 - k) ** 3; b.textContent = m[1] + Math.round(n * e).toLocaleString('es-AR') + m[3]; if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}
function render() {
  if (!PERF[P][1].includes(cur)) cur = PERF[P][1][0];
  document.body.dataset.perfil = P;
  $('#who').innerHTML = `<span>¿Quién entra?</span><div>${Object.entries(PERF).map(([k, [l]]) => `<button ${k === P ? 'class="on" aria-pressed="true"' : 'aria-pressed="false"'} onclick="setPerfil('${k}')">${l}</button>`).join('')}</div>`;
  $('#nav').innerHTML = GROUPS.map(([g, ks]) => { const t = ks.filter(k => PERF[P][1].includes(k)); return t.length ? `<span class="ng">${g}</span>` + t.map(k => `<button ${k === cur ? 'class="on" aria-current="page"' : ''} onclick="go('${k}')">${TABS[k][0]}</button>`).join('') : ''; }).join('');
  $('#main').innerHTML = `<p class="eyebrow">${longDate(TODAY)}</p>` + TABS[cur][1]();
  if (cur === 'reservas') quote();
  if (cur === 'finanzas') sim();
  const fresh = cur !== lastTab; lastTab = cur; $('#main').classList.toggle('anim', fresh); if (fresh) countUp();
}
function reset() { modal(`<h3>¿Volver a empezar?</h3><p>Se cargan de nuevo los datos de ejemplo y se borra lo que hayas probado.</p><div class="row"><button class="btn" onclick="doReset()">Sí, volver a empezar</button><button class="btn sec" onclick="closeM()">No</button></div>`); }
function doReset() {
  closeM(); S = seed(); CHAT = []; save(); theme(); go(PERF[P][1][0]); toast('Listo: datos de ejemplo cargados de nuevo.');
}
theme(); render();
let seen; try { seen = localStorage.getItem(KEY + '-tour'); } catch (e) {}
if (!seen) setTimeout(() => tour(0), 400);
</script>
